name: Apply V0.3 Task 4 harness repair
on:
  push:
    branches: [feature/v0.3-git-source-adapter]
    paths: ['.github/workflows/apply-v03-task4-harness-repair.yml']
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    env:
      PAYLOAD: 
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.3-git-source-adapter
          fetch-depth: 0
      - name: Restore exact harness source
        run: |
          python - <<'PY'
          import base64, hashlib, os, pathlib, zlib
          data = zlib.decompress(base64.b64decode(os.environ['PAYLOAD']))
          assert hashlib.sha256(data).hexdigest() == 'a24982a9ad94de186cda6e78f130c324f817541fea82580f105ec1bcf8344834'
          pathlib.Path('wikiskill/harness.py').write_bytes(data)
          PY
          python -m py_compile wikiskill/harness.py
      - name: Commit repair and cleanup
        run: |
          git config user.email wikiskill@local
          git config user.name wikiskill-evolution
          git add wikiskill/harness.py
          git rm .github/workflows/apply-v03-task4-harness-repair.yml
          git commit -m 'fix: restore V0.3 harness lifecycle indentation'
          git push origin HEAD:feature/v0.3-git-source-adapter
