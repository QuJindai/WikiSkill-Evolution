name: Apply V0.2 README summary

on:
  push:
    branches: [feature/v0.2-asset-drivers]
    paths: ['.github/workflows/apply-v02-readme.yml']

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.2-asset-drivers
          fetch-depth: 0
      - name: Insert V0.2 README section
        env:
          SECTION_B64: 
        run: |
          python - <<'PY'
          import base64, os
          from pathlib import Path
          p = Path('README.md')
          text = p.read_text()
          section = base64.b64decode(os.environ['SECTION_B64']).decode()
          marker = '## Why Hermes?\n'
          if '## V0.2: governed multi-asset evolution' not in text:
              if marker not in text:
                  raise SystemExit('README insertion marker not found')
              text = text.replace(marker, section + marker, 1)
              p.write_text(text)
          PY
      - name: Commit README update
        run: |
          git config user.email wikiskill@local
          git config user.name wikiskill-evolution
          git add README.md
          git rm .github/workflows/apply-v02-readme.yml
          git commit -m 'docs: add v0.2 README summary'
          git push origin HEAD:feature/v0.2-asset-drivers
