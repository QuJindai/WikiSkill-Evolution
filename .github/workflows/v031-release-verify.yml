name: Verify V0.3.1 Release

on:
  push:
    branches:
      - feature/v0.3.1-runtime-binding

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.3.1-runtime-binding
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install -e .
          python -m pip install pytest pyflakes
      - name: Focused causal and security suite
        run: |
          set -o pipefail
          python -m pytest tests/test_runtime_bindings.py tests/test_v031_core_sealing.py tests/test_v031_runtime_cli.py tests/test_v031_runtime_integration.py tests/test_sources.py tests/test_core_adapter.py tests/test_v03_core_runtime_binding.py -q | tee /tmp/focused.txt
      - name: Full lint
        run: |
          set -o pipefail
          python -m pyflakes wikiskill/ tests/ | tee /tmp/pyflakes.txt
      - name: Full test suite
        run: |
          set -o pipefail
          python -m pytest tests/ -q | tee /tmp/full.txt
      - name: Persist verification evidence and remove verifier
        run: |
          git config user.email wikiskill@local
          git config user.name wikiskill-evolution
          git rm .github/workflows/v031-release-verify.yml
          if git ls-files '.github/workflows/v031-*' 'scripts/v031_*' | grep -q .; then
            echo 'temporary v031 workflow/script remains tracked' >&2
            exit 1
          fi
          if git ls-files | grep -E '(^|/)(__pycache__|\.pytest_cache|runtime-worktrees|core-worktrees|source-worktrees)(/|$)|\.pyc$' | grep -q .; then
            echo 'generated runtime/test artifact remains tracked' >&2
            exit 1
          fi
          mkdir -p docs/superpowers/plans
          {
            echo '# V0.3.1 Release Verification'
            echo
            echo "verified_input_head: $(git rev-parse HEAD)"
            echo 'python: 3.12'
            echo 'pyflakes_exit_code: 0'
            echo 'cleanliness: PASS — no tracked v031 staging workflow/script, runtime/core/source worktree, pytest cache, __pycache__, or pyc artifact'
            echo
            echo '## Focused causal/security suite'
            echo '```text'
            cat /tmp/focused.txt
            echo '```'
            echo
            echo '## Full pytest'
            echo '```text'
            cat /tmp/full.txt
            echo '```'
            echo
            echo '## Pyflakes'
            echo '```text'
            cat /tmp/pyflakes.txt
            echo '```'
          } > docs/superpowers/plans/2026-09-03-v0.3.1-release-verification.md
          git add -A
          git commit -m 'test: record V0.3.1 release verification'
          git push origin HEAD:feature/v0.3.1-runtime-binding
