name: Diagnose V0.3 Task 5 RED
on:
  push:
    branches: [feature/v0.3-git-source-adapter]
    paths: ['.github/workflows/diag-v03-task5-red.yml']
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.3-git-source-adapter
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e . pytest pyflakes
      - name: Capture Task 5 RED
        shell: bash
        run: |
          set +e
          python3 -m pytest tests/test_v03_source_cli.py -vv > /tmp/red.txt 2>&1
          rc=$?
          {
            echo '# V0.3 Task 5 RED diagnostic'
            echo
            echo "pytest_exit_code=$rc"
            echo
            echo '```text'
            cat /tmp/red.txt
            echo '```'
          } > docs/superpowers/plans/2026-09-02-v0.3-task5-red-diagnostic.md
          git config user.email wikiskill@local
          git config user.name wikiskill-evolution
          git add docs/superpowers/plans/2026-09-02-v0.3-task5-red-diagnostic.md
          git rm .github/workflows/diag-v03-task5-red.yml
          git commit -m 'chore: record Task 5 RED diagnostic'
          git push origin HEAD:feature/v0.3-git-source-adapter
