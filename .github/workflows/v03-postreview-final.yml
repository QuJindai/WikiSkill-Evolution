name: Finalize V0.3 post-review boundary

on:
  push:
    branches:
      - feature/v0.3-git-source-adapter

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.3-git-source-adapter
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Correct runtime-binding documentation
        run: python scripts/v03_postreview_finalize.py patch
      - name: Install dependencies
        run: python -m pip install -e . pytest pyflakes
      - name: Focused security and runtime-binding suite
        shell: bash
        run: |
          set -o pipefail
          python -m pytest tests/test_sources.py tests/test_core_adapter.py tests/test_v03_contract.py tests/test_v03_core_runtime_binding.py -q | tee /tmp/security.txt
      - name: Pyflakes
        shell: bash
        run: |
          set -o pipefail
          python -m pyflakes wikiskill/ tests/ | tee /tmp/pyflakes.txt
      - name: Full pytest
        shell: bash
        run: |
          set -o pipefail
          python -m pytest tests/ -q | tee /tmp/full.txt
      - name: Write evidence
        run: python scripts/v03_postreview_finalize.py evidence
      - name: Commit verified docs and remove temporary files
        shell: bash
        run: |
          rm -f .github/workflows/v03-postreview-final.yml scripts/v03_postreview_finalize.py
          git config user.email wikiskill@local
          git config user.name wikiskill-evolution
          git add -A README.md docs .github/workflows/v03-postreview-final.yml scripts/v03_postreview_finalize.py
          git diff --cached --quiet && exit 0
          git commit -m 'docs: document core runtime-binding safety boundary'
          git push origin HEAD:feature/v0.3-git-source-adapter
