name: Fix V0.3.1 Task 3 lint residue

on:
  push:
    branches: [feature/v0.3.1-runtime-binding]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.3.1-runtime-binding
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Remove unused test import and verify Task 3
        shell: bash
        run: |
          sed -i '/^import sys$/d' tests/test_runtime_bindings.py
          python -m pip install -e . pytest pyflakes
          python -m pytest tests/test_runtime_bindings.py -q | tee /tmp/task3.txt
          python -m pyflakes wikiskill/runtime_bindings.py tests/test_runtime_bindings.py
      - name: Commit GREEN evidence and remove workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('docs/superpowers/plans/2026-09-02-v0.3.1-execution-log.md')
          text = path.read_text()
          addition = '- Task 3 RED `a3eb7f567b60dd709eec570a06cf9cd39e17eea7`: detached accepted/candidate runtime and Python protocol tests added before `BoundRuntimeSession/bind_sha/bind_active_accepted`; focused RED confirmed missing APIs.\n- Task 3 GREEN `d1ef0c53f19db46da69a566aaf15d8ac9c1a4522`: real detached accepted-runtime worktrees, sealed candidate binding, fixed Python JSON protocol, SHA/blob identity checks, minimal environment, idempotent close. Focused pytest 13/13 PASS; diagnostic found only one unused test import.\n'
          if 'Task 3 RED' not in text:
              path.write_text(text + addition)
          PY
          rm -f .github/workflows/v031-task3-lint-fix.yml
          git config user.email 'wikiskill@local'
          git config user.name 'wikiskill-evolution'
          git add tests/test_runtime_bindings.py docs/superpowers/plans/2026-09-02-v0.3.1-execution-log.md .github/workflows/v031-task3-lint-fix.yml
          git commit -m 'test: remove Task 3 lint residue'
          git push origin HEAD:feature/v0.3.1-runtime-binding
