name: Apply V0.3 final spec consistency

on:
  push:
    branches: [feature/v0.3-git-source-adapter]
    paths: ['.github/workflows/apply-v03-spec-final.yml']

permissions:
  contents: write

jobs:
  update-spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.3-git-source-adapter
          fetch-depth: 0
      - name: Apply final consistency fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/superpowers/specs/2026-09-01-v0.3-git-source-adapter-design.md')
          text = p.read_text(encoding='utf-8')
          reps = [
            ('3. proposal `base_sha` equals the manifest accepted `baseline_sha`;\n4. repository HEAD/state can resolve that baseline SHA;', '3. proposal `base_sha` equals the current authoritative `refs/wikiskill/<source_id>/accepted` SHA (initialized from manifest `baseline_sha` at first registration);\n4. repository object database can resolve that accepted SHA;'),
            ('registered source repository\n        ↓ exact baseline_sha', 'registered source repository\n        ↓ exact accepted ref SHA'),
            ('8. `..` traversal rejected;\n9. absolute path rejected;\n10. symlink escape rejected;\n11. submodule boundary mutation rejected;\n12. deny rule overrides allow rule;\n13. non-allowlisted file rejected;\n14. file-count limit rejected;\n15. total-line budget rejected;\n16. binary mutation rejected;\n17. proposal command/shell/environment/gate-control fields rejected.', '10. `..` traversal rejected;\n11. absolute path rejected;\n12. symlink escape rejected;\n13. submodule boundary mutation rejected;\n14. deny rule overrides allow rule;\n15. non-allowlisted file rejected;\n16. file-count limit rejected;\n17. total-line budget rejected;\n18. binary mutation rejected;\n19. proposal command/shell/environment/gate-control fields rejected.'),
            ('33. full rejected core proposal remains in Wiki;\n34. gate summaries remain in Wiki;\n35. accepted/rejected source SHA evidence is recorded;\n36. V0.2 skill/prompt/harness behavior remains unchanged;\n37. legacy proposal without target still defaults to skill;\n38. raw traces remain immutable;\n39. V0.2 strict `R_candidate > R_best` rule remains intact;\n40. runtime remains dependency-minimal; new third-party dependency requires explicit design change.', '36. full rejected core proposal remains in Wiki;\n37. gate summaries remain in Wiki;\n38. accepted/rejected source SHA evidence is recorded;\n39. V0.2 skill/prompt/harness behavior remains unchanged;\n40. legacy proposal without target still defaults to skill;\n41. raw traces remain immutable;\n42. V0.2 strict `R_candidate > R_best` rule remains intact;\n43. runtime remains dependency-minimal; new third-party dependency requires explicit design change.')
          ]
          for old, new in reps:
              if old not in text:
                  raise SystemExit('expected spec text not found: ' + old[:100])
              text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')
          PY
      - name: Commit spec and remove one-shot workflow
        run: |
          git config user.email wikiskill@local
          git config user.name wikiskill-evolution
          git add docs/superpowers/specs/2026-09-01-v0.3-git-source-adapter-design.md
          git rm .github/workflows/apply-v03-spec-final.yml
          git commit -m 'docs: finalize V0.3 Git Source Adapter spec'
          git push origin HEAD:feature/v0.3-git-source-adapter
