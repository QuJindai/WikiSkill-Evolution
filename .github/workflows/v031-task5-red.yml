name: Verify V0.3.1 Task 5 RED

on:
  push:
    branches: [feature/v0.3.1-runtime-binding]

permissions:
  contents: write

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.3.1-runtime-binding
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Confirm causal runtime lifecycle is RED
        shell: bash
        run: |
          python -m pip install -e . pytest pyflakes
          set +e
          python -m pytest tests/test_v031_runtime_integration.py -vv > /tmp/red.txt 2>&1
          code=$?
          set -e
          cat /tmp/red.txt
          test "$code" -ne 0
          ! grep -Eq "ERROR collecting|NameError|SyntaxError|IndentationError" /tmp/red.txt
          grep -q "test_active_runtime_owns_baseline_and_records_identity" /tmp/red.txt
          grep -q "test_core_candidate_real_runtime_causes_acceptance" /tmp/red.txt
          grep -q "test_next_iteration_rebinds_newly_accepted_runtime" /tmp/red.txt
      - name: Record RED evidence and remove workflow
        shell: bash
        run: |
          mkdir -p docs/superpowers/plans
          {
            echo '# V0.3.1 Task 5 RED'
            echo
            echo 'Expected failure: harness has no accepted-runtime scoring, candidate binding transaction, or recovery semantics yet.'
            echo
            echo '```text'
            cat /tmp/red.txt
            echo '```'
          } > docs/superpowers/plans/2026-09-02-v0.3.1-task5-red.md
          rm -f .github/workflows/v031-task5-red.yml
          git config user.email 'wikiskill@local'
          git config user.name 'wikiskill-evolution'
          git add tests/test_v031_runtime_integration.py docs/superpowers/plans/2026-09-02-v0.3.1-task5-red.md .github/workflows/v031-task5-red.yml
          git commit -m 'test: record V0.3.1 Task 5 RED'
          git push origin HEAD:feature/v0.3.1-runtime-binding
