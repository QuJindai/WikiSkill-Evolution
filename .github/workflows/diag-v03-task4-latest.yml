name: Diagnose V0.3 Task 4 latest
on:
  push:
    branches: [feature/v0.3-git-source-adapter]
    paths: ['.github/workflows/diag-v03-task4-latest.yml']
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.3-git-source-adapter
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e . pytest pyflakes
      - name: Capture focused compatibility suite
        shell: bash
        run: |
          set +e
          python3 -m pytest tests/test_harness.py tests/test_assets.py tests/test_v02_contract.py tests/test_v02_safety.py tests/test_v03_contract.py -vv > /tmp/task4.txt 2>&1
          rc=$?
          {
            echo '# V0.3 Task 4 latest compatibility diagnostic'
            echo
            echo "pytest_exit_code=$rc"
            echo
            echo '```text'
            cat /tmp/task4.txt
            echo '```'
          } > docs/superpowers/plans/2026-09-02-v0.3-task4-latest-diagnostic.md
          git config user.email wikiskill@local
          git config user.name wikiskill-evolution
          git add docs/superpowers/plans/2026-09-02-v0.3-task4-latest-diagnostic.md
          git rm .github/workflows/diag-v03-task4-latest.yml
          git commit -m 'chore: record latest Task 4 compatibility diagnostic'
          git push origin HEAD:feature/v0.3-git-source-adapter
