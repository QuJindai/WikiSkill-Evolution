name: Apply V0.2 green patch

on:
  push:
    branches: [feature/v0.2-asset-drivers]
    paths: ['.github/workflows/apply-v02-green.yml']

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.2-asset-drivers
          fetch-depth: 0
      - name: Decode approved implementation
        env:
          HARNESS_GZ_B64: 
          GATE_GZ_B64: 
        run: |
          python - <<'PY'
          import base64, gzip, os
          from pathlib import Path
          Path('wikiskill/harness.py').write_bytes(gzip.decompress(base64.b64decode(os.environ['HARNESS_GZ_B64'])))
          gate = gzip.decompress(base64.b64decode(os.environ['GATE_GZ_B64'])).decode()
          p = Path('wikiskill/prompts.py')
          text = p.read_text()
          marker = 'def gate_outcome_entry('
          text = text[:text.index(marker)] + gate
          p.write_text(text)
          PY
      - name: Commit decoded patch
        run: |
          git config user.email wikiskill@local
          git config user.name wikiskill-evolution
          git add wikiskill/harness.py wikiskill/prompts.py
          git rm .github/workflows/apply-v02-green.yml
          git commit -m 'feat: unify candidate lifecycle across asset drivers'
          git push origin HEAD:feature/v0.2-asset-drivers
