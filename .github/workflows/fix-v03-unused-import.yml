name: Fix V0.3 unused import
on:
  push:
    branches: [feature/v0.3-git-source-adapter]
    paths: ['.github/workflows/fix-v03-unused-import.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.3-git-source-adapter
          fetch-depth: 0
      - name: Remove unused pytest import and self-delete
        shell: bash
        run: |
          sed -i '/^import pytest$/d' tests/test_v03_contract.py
          git config user.email wikiskill@local
          git config user.name wikiskill-evolution
          git add tests/test_v03_contract.py
          git rm .github/workflows/fix-v03-unused-import.yml
          git commit -m 'test: remove unused V0.3 pytest import'
          git push origin HEAD:feature/v0.3-git-source-adapter
