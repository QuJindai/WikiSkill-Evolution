name: Apply V0.3 Task 4
on:
  push:
    branches: [feature/v0.3-git-source-adapter]
    paths: ['.github/workflows/apply-v03-task4.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.3-git-source-adapter
          fetch-depth: 0
      - name: Integrate core driver and engineering gates
        run: |
          python - <<'PY'
          from pathlib import Path

          # assets.py
          p = Path('wikiskill/assets.py')
          s = p.read_text()
          if 'from . import core_adapter\n' not in s:
              s = s.replace('from typing import Any\n\n', 'from typing import Any\n\nfrom . import core_adapter\n\n', 1)
          start = s.index('class GitAssetDriver:')
          end = s.index('\n\nclass SkillDriver', start)
          base = '''class GitAssetDriver:\n    target = ""\n\n    def root(self, ws: str) -> str:\n        raise NotImplementedError\n\n    def initial_message(self) -> str:\n        return f"A0: empty {self.target} asset set"\n\n    def prepare(self, ws: str, iteration: int, proposal: dict | None = None):\n        root = self.root(ws)\n        _ensure_git_repo(root, self.initial_message())\n        _git_commit(root, f"base iter-{iteration}", allow_empty=True)\n        return None\n\n    def validate(self, ws: str, proposal: dict) -> None:\n        raise NotImplementedError\n\n    def apply(self, ws: str, proposal: dict, context=None) -> str:\n        raise NotImplementedError\n\n    def diff(self, ws: str, context=None) -> str:\n        return _working_diff(self.root(ws))\n\n    def pre_gates(self, ws: str, proposal: dict, context=None) -> list[dict]:\n        return []\n\n    def accept(self, ws: str, iteration: int, score: float, context=None):\n        _git_commit(self.root(ws), f"accept iter-{iteration} R={score}", allow_empty=True)\n        return None\n\n    def rollback(self, ws: str, context=None):\n        root = self.root(ws)\n        _git(root, "reset", "--hard", "-q")\n        _git(root, "clean", "-fd", "-q")\n        return None\n'''
          s = s[:start] + base + s[end:]
          old_apply = '    def apply(self, ws: str, proposal: dict) -> str:\n'
          new_apply = '    def apply(self, ws: str, proposal: dict, context=None) -> str:\n'
          s = s.replace(old_apply, new_apply, 3)
          core_start = s.index('class CoreDriver')
          core_end = s.index('\n\n_SKILL_DRIVER', core_start)
          core = '''class CoreDriver(GitAssetDriver):\n    target = "core"\n\n    def root(self, ws: str) -> str:\n        return os.path.join(ws, "assets", "core", "active")\n\n    def validate(self, ws: str, proposal: dict) -> None:\n        core_adapter.validate_core_proposal(ws, proposal)\n\n    def prepare(self, ws: str, iteration: int, proposal: dict | None = None):\n        if proposal is None:\n            raise ValueError("core prepare requires proposal")\n        return core_adapter.begin_candidate(ws, iteration, proposal)\n\n    def apply(self, ws: str, proposal: dict, context=None) -> str:\n        if context is None:\n            raise ValueError("core apply requires candidate context")\n        return core_adapter.apply_candidate(context)\n\n    def diff(self, ws: str, context=None) -> str:\n        if context is None:\n            raise ValueError("core diff requires candidate context")\n        return core_adapter.candidate_diff(context)\n\n    def pre_gates(self, ws: str, proposal: dict, context=None) -> list[dict]:\n        if context is None:\n            raise ValueError("core pre_gates requires candidate context")\n        return core_adapter.run_pre_gates(context)\n\n    def accept(self, ws: str, iteration: int, score: float, context=None):\n        if context is None:\n            raise ValueError("core accept requires candidate context")\n        return core_adapter.accept_candidate(context, iteration)\n\n    def rollback(self, ws: str, context=None):\n        if context is None:\n            raise ValueError("core rollback requires candidate context")\n        return core_adapter.reject_candidate(context)\n'''
          s = s[:core_start] + core + s[core_end:]
          p.write_text(s)

          # harness.py: preserve helpers before _history_entry and replace the lifecycle tail.
          p = Path('wikiskill/harness.py')
          s = p.read_text()
          s = s.replace('from . import agents, assets, gating, prompts, tasks as tasks_mod, traces, wiki\n',
                        'from . import agents, assets, core_adapter, gating, prompts, tasks as tasks_mod, traces, wiki\n', 1)
          prefix = s[:s.index('def _history_entry')]
          tail = r'''def _history_entry(k: int, train_mean: float, *, target: str, action: str,
                   status: str, accepted: bool, proposal: str,
                   r_val: float | None = None, error: str | None = None,
                   engineering: dict | None = None) -> dict:
    out = {"iter": k, "train_mean": train_mean, "r_val": r_val,
           "accepted": accepted, "proposal": proposal, "target": target,
           "action": action, "status": status}
    if error:
        out["error"] = error
    if engineering is not None:
        out["engineering"] = engineering
    return out


def _engineering_evidence(proposal: dict, context=None, gate_results=None,
                          cleanup=None, finalize=None) -> dict | None:
    if proposal.get("target") != "core" and not gate_results and cleanup is None and finalize is None:
        return None
    out = {
        "source_id": proposal.get("source_id"),
        "base_sha": proposal.get("base_sha"),
        "candidate_sha": getattr(context, "candidate_sha", None),
        "changed_files": list(getattr(context, "changed_files", ()) or ()),
        "gates": list(gate_results or getattr(context, "gate_results", ()) or ()),
    }
    if cleanup is not None:
        out["cleanup"] = cleanup
    if finalize is not None:
        out["finalize"] = finalize
        if isinstance(finalize, dict):
            out["candidate_sha"] = finalize.get("candidate_sha", out["candidate_sha"])
            out["accepted_sha"] = finalize.get("accepted_sha")
            if finalize.get("cleanup") is not None:
                out["cleanup"] = finalize["cleanup"]
    return out


def _record_outcome(ws: str, state: dict, k: int, train_mean: float,
                    proposal: dict, desc: str, diff: str, *, status: str,
                    accepted: bool, r_val: float | None, prev_best: float | None,
                    error: str | None = None, engineering: dict | None = None) -> None:
    target = proposal.get("target", "skill")
    action = proposal.get("action", "?")
    state["history"].append(_history_entry(
        k, train_mean, target=target, action=action, status=status,
        accepted=accepted, proposal=desc, r_val=r_val, error=error,
        engineering=engineering))
    state["next_iter"] = k + 1
    gating.save_state(ws, state)
    wiki.append_skill_impact(ws, prompts.gate_outcome_entry(
        ws, k, proposal, r_val, accepted, diff, prev_best,
        status=status, error=error, engineering=engineering))
    wiki.append_log(
        ws, f"iter-{k:02d}: train={train_mean} target={target} status={status} "
            f"R_val={r_val} R_best={state['r_best']}"
            + (f" error={error}" if error else ""))
    wiki.commit(ws, f"iter-{k:02d}: {status} target={target}")


def evolve(ws: str, iters: int = 3, model: str | None = None,
           provider: str | None = None, runner=agents.run_agent,
           dry_run: bool = False, verbose: bool = True,
           max_turns: int | None = None, no_early_stop: bool = False) -> dict:
    def log(msg: str) -> None:
        if verbose:
            print(f"[wikiskill] {msg}")

    splits = tasks_mod.splits(ws)
    train, val = splits["train"], splits["val"]
    state = gating.load_state(ws)
    if model and not dry_run:
        agents.patch_profile_model(ws, model, provider)
        log(f"profile default model → {model} (provider: {provider or 'unchanged'})")
        model = None
    wiki.ensure(ws)

    if state.get("baseline") is None:
        log(f"baseline validation: {len(val)} val tasks, S0=∅")
        gate0 = gating.run_gate(ws, val, 0, model=model, runner=runner,
                                dry_run=dry_run, overwrite=True, max_turns=max_turns)
        state["baseline"] = gate0["mean"]
        state["r_best"] = gate0["mean"]
        wiki.append_log(ws, f"iter-00 baseline: R={gate0['mean']} (S0=∅, {len(val)} val tasks)")
        gating.save_state(ws, state)

    for k in range(state["next_iter"], iters + 1):
        if state["r_best"] == 1.0 and not no_early_stop:
            log("R_best == 1.0 → early stop")
            break
        log(f"iter {k}/{iters}: train rollouts ({len(train)} tasks)")
        train_results = [gating.run_task(ws, t, k, model=model, runner=runner,
                                         dry_run=dry_run, overwrite=True,
                                         max_turns=max_turns) for t in train]
        train_mean = gating.mean_score(train_results)

        sampled = sample_traces(ws, k, train_results)
        log(f"iter {k}: wiki maintenance (sampled {len(sampled)} traces)")
        maintain_step(ws, k, sampled, runner=runner, dry_run=dry_run)
        wiki.commit(ws, f"iter-{k:02d}: maintainer updates")

        log(f"iter {k}: evolution proposal")
        proposal, _ = propose_step(ws, k, train_results, runner=runner, dry_run=dry_run)
        raw = proposal if proposal is not None else {"action": "no_action"}
        try:
            proposal = assets.normalize_proposal(raw)
        except ValueError as exc:
            target = raw.get("target", "skill") if isinstance(raw, dict) else "?"
            action = raw.get("action", "?") if isinstance(raw, dict) else "?"
            err = str(exc)
            state["history"].append(_history_entry(
                k, train_mean, target=target, action=action, status="invalid",
                accepted=False, proposal=f"invalid {target}", error=err))
            state["next_iter"] = k + 1
            gating.save_state(ws, state)
            wiki.append_skill_impact(ws, prompts.gate_outcome_entry(
                ws, k, raw if isinstance(raw, dict) else {"raw": raw}, None,
                False, "", state["r_best"], status="invalid", error=err))
            wiki.append_log(ws, f"iter-{k:02d}: train={train_mean} proposal=invalid target={target}: {err}")
            wiki.commit(ws, f"iter-{k:02d}: invalid proposal")
            continue

        target = proposal["target"]
        action = proposal["action"]
        if action == "no_action":
            state["history"].append(_history_entry(
                k, train_mean, target=target, action=action, status="no_action",
                accepted=False, proposal="no_action"))
            wiki.append_skill_impact(ws, prompts.gate_outcome_entry(
                ws, k, proposal, None, False, "", state["r_best"], status="no_action"))
            wiki.append_log(ws, f"iter-{k:02d}: train={train_mean} proposal=no_action")
            state["next_iter"] = k + 1
            gating.save_state(ws, state)
            wiki.commit(ws, f"iter-{k:02d}: no action")
            continue

        driver = None
        context = None
        prepared = False
        desc = f"{action} {target}"
        diff = ""
        pre_gates = []
        try:
            driver = assets.resolve_driver(target)
            driver.validate(ws, proposal)
            context = driver.prepare(ws, k, proposal)
            prepared = True
            desc = driver.apply(ws, proposal, context)
            diff = driver.diff(ws, context)
            pre_gates = driver.pre_gates(ws, proposal, context)
        except core_adapter.CoreOperationalError as exc:
            cleanup = None
            rollback_error = None
            if prepared and driver is not None:
                try:
                    cleanup = driver.rollback(ws, context)
                except Exception as rollback_exc:
                    rollback_error = str(rollback_exc)
            err = str(exc)
            if rollback_error:
                err += f"; rollback failed: {rollback_error}"
            engineering = _engineering_evidence(
                proposal, context, pre_gates, cleanup=cleanup)
            _record_outcome(
                ws, state, k, train_mean, proposal, f"operational {target}", diff,
                status="operational_error", accepted=False, r_val=None,
                prev_best=state["r_best"], error=err, engineering=engineering)
            continue
        except ValueError as exc:
            cleanup = None
            if prepared and driver is not None:
                try:
                    cleanup = driver.rollback(ws, context)
                except Exception as rollback_exc:
                    engineering = _engineering_evidence(
                        proposal, context, pre_gates,
                        cleanup={"removed": False, "error": str(rollback_exc)})
                    _record_outcome(
                        ws, state, k, train_mean, proposal, f"operational {target}", diff,
                        status="operational_error", accepted=False, r_val=None,
                        prev_best=state["r_best"], error=str(rollback_exc),
                        engineering=engineering)
                    continue
            err = str(exc)
            engineering = _engineering_evidence(
                proposal, context, pre_gates, cleanup=cleanup)
            _record_outcome(
                ws, state, k, train_mean, proposal, f"invalid {target}", diff,
                status="invalid", accepted=False, r_val=None,
                prev_best=state["r_best"], error=err, engineering=engineering)
            continue

        failed_gate = next((item for item in pre_gates if item.get("status") == "fail"), None)
        if failed_gate is not None:
            try:
                cleanup = driver.rollback(ws, context)
            except core_adapter.CoreOperationalError as exc:
                engineering = _engineering_evidence(
                    proposal, context, pre_gates,
                    cleanup={"removed": False, "error": str(exc)})
                _record_outcome(
                    ws, state, k, train_mean, proposal, desc, diff,
                    status="operational_error", accepted=False, r_val=None,
                    prev_best=state["r_best"], error=str(exc),
                    engineering=engineering)
                continue
            engineering = _engineering_evidence(
                proposal, context, pre_gates, cleanup=cleanup)
            _record_outcome(
                ws, state, k, train_mean, proposal, desc, diff,
                status="rejected", accepted=False, r_val=None,
                prev_best=state["r_best"],
                error=failed_gate.get("summary") or f"{failed_gate.get('gate')} gate failed",
                engineering=engineering)
            continue

        gatek = gating.run_gate(ws, val, k, model=model, runner=runner,
                                dry_run=dry_run, overwrite=True, max_turns=max_turns)
        r_val = gatek["mean"]
        prev_best = state["r_best"]
        accepted = r_val > prev_best
        if accepted:
            try:
                finalize = driver.accept(ws, k, r_val, context)
            except core_adapter.CoreOperationalError as exc:
                engineering = _engineering_evidence(
                    proposal, context, pre_gates,
                    finalize={"error": str(exc)})
                _record_outcome(
                    ws, state, k, train_mean, proposal, desc, diff,
                    status="operational_error", accepted=False, r_val=r_val,
                    prev_best=prev_best, error=str(exc), engineering=engineering)
                continue
            state["r_best"] = r_val
            status = "accepted"
            engineering = _engineering_evidence(
                proposal, context, pre_gates, finalize=finalize)
        else:
            try:
                cleanup = driver.rollback(ws, context)
            except core_adapter.CoreOperationalError as exc:
                engineering = _engineering_evidence(
                    proposal, context, pre_gates,
                    cleanup={"removed": False, "error": str(exc)})
                _record_outcome(
                    ws, state, k, train_mean, proposal, desc, diff,
                    status="operational_error", accepted=False, r_val=r_val,
                    prev_best=prev_best, error=str(exc), engineering=engineering)
                continue
            status = "rejected"
            engineering = _engineering_evidence(
                proposal, context, pre_gates, cleanup=cleanup)

        _record_outcome(
            ws, state, k, train_mean, proposal, desc, diff,
            status=status, accepted=accepted, r_val=r_val,
            prev_best=prev_best, engineering=engineering)

    return state
'''
          p.write_text(prefix + tail)

          # prompts.py
          p = Path('wikiskill/prompts.py')
          s = p.read_text()
          s = s.replace(
              '                       status: str | None = None, error: str | None = None) -> str:\n',
              '                       status: str | None = None, error: str | None = None,\n                       engineering: dict | None = None) -> str:\n', 1)
          s = s.replace(
              '        "invalid": "INVALID",\n        "no_action": "NO_ACTION",\n',
              '        "invalid": "INVALID",\n        "operational_error": "OPERATIONAL_ERROR",\n        "no_action": "NO_ACTION",\n', 1)
          s = s.replace(
              '    if error:\n        body += ["", f"Validation error: {error}"]\n    if diff.strip():\n',
              '    if error:\n        body += ["", f"Validation error: {error}"]\n    if engineering is not None:\n        body += ["", "Engineering evidence:", "", "```json",\n                 json.dumps(engineering, indent=2, sort_keys=True), "```"]\n    if diff.strip():\n', 1)
          s = s.replace(
              '    if effective == "invalid":\n        body += ["", "Validation: structural validation failed; no held-out rollout performed."]\n    elif accepted:\n',
              '    if effective == "invalid":\n        body += ["", "Validation: structural validation failed; no held-out rollout performed."]\n    elif effective == "operational_error":\n        body += ["", "Validation: operational failure; accepted source state and R_best were not advanced."]\n    elif effective == "rejected" and r_val is None:\n        body += ["", "Validation: engineering gate rejected the candidate before held-out rollout."]\n    elif accepted:\n', 1)
          p.write_text(s)
          PY
          git config user.email wikiskill@local
          git config user.name wikiskill-evolution
          git add wikiskill/assets.py wikiskill/harness.py wikiskill/prompts.py
          git rm .github/workflows/apply-v03-task4.yml
          git commit -m 'feat: gate core source candidates in evolution loop'
          git push origin HEAD:feature/v0.3-git-source-adapter
