name: Repair V0.3.1 Task 4 RED fixture

on:
  push:
    branches: [feature/v0.3.1-runtime-binding]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.3.1-runtime-binding
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Repair test-only FakeBound closure and re-run RED
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/test_v031_runtime_cli.py')
          text = path.read_text()
          old = '''    class FakeBound:\n        runner = fake_runner\n        evidence = evidence\n\n        def close(self):\n            events.append("close")\n            return {"closed": True}\n'''
          new = '''    class FakeBound:\n        def __init__(self):\n            self.runner = fake_runner\n            self.evidence = evidence\n\n        def close(self):\n            events.append("close")\n            return {"closed": True}\n'''
          if old not in text:
              raise SystemExit('FakeBound fixture anchor not found')
          path.write_text(text.replace(old, new, 1))
          PY
          python -m pip install -e . pytest pyflakes
          set +e
          python -m pytest tests/test_v031_runtime_cli.py -q > /tmp/red2.txt 2>&1
          code=$?
          set -e
          cat /tmp/red2.txt
          test "$code" -ne 0
          ! grep -q "NameError" /tmp/red2.txt
          grep -q "runtime_evidence" /tmp/red2.txt
          grep -q "invalid choice: 'runtime'" /tmp/red2.txt
          grep -q "runtime binding" /tmp/red2.txt
      - name: Record corrected RED and cleanup
        shell: bash
        run: |
          {
            echo '# V0.3.1 Task 4 RED — corrected fixture'
            echo
            echo 'The first RED contained one test-only NameError. This rerun repairs only that fixture; production code is unchanged.'
            echo
            echo '```text'
            cat /tmp/red2.txt
            echo '```'
          } > docs/superpowers/plans/2026-09-02-v0.3.1-task4-red.md
          rm -f .github/workflows/v031-task4-red-fixture.yml
          git config user.email 'wikiskill@local'
          git config user.name 'wikiskill-evolution'
          git add tests/test_v031_runtime_cli.py docs/superpowers/plans/2026-09-02-v0.3.1-task4-red.md .github/workflows/v031-task4-red-fixture.yml
          git commit -m 'test: repair Task 4 RED fixture'
          git push origin HEAD:feature/v0.3.1-runtime-binding
