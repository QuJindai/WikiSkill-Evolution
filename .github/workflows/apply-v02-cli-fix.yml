name: Apply V0.2 CLI compatibility fix

on:
  push:
    branches: [feature/v0.2-asset-drivers]
    paths: ['.github/workflows/apply-v02-cli-fix.yml']

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.2-asset-drivers
          fetch-depth: 0
      - name: Apply minimal run-task fix
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('wikiskill/cli.py')
          text = p.read_text()
          old = '''    r = gating.run_task(
        ws, task, args.iter, dry_run=args.dry_run, overwrite=args.overwrite,
        runner=lambda *a, **k: agents.run_agent(
            *a, **k, max_turns=args.max_turns, run_budget=args.run_budget))'''
          new = '''    r = gating.run_task(
        ws, task, args.iter, dry_run=args.dry_run, overwrite=args.overwrite,
        max_turns=args.max_turns,
        runner=lambda *a, **k: agents.run_agent(
            *a, **k, run_budget=args.run_budget))'''
          if old not in text:
              raise SystemExit('expected cmd_run_task block not found')
          p.write_text(text.replace(old, new, 1))
          PY
      - name: Commit fix
        run: |
          git config user.email wikiskill@local
          git config user.name wikiskill-evolution
          git add wikiskill/cli.py
          git rm .github/workflows/apply-v02-cli-fix.yml
          git commit -m 'fix: forward run-task max-turns once'
          git push origin HEAD:feature/v0.2-asset-drivers
