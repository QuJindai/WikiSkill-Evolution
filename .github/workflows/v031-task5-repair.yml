name: Repair V0.3.1 Task 5

on:
  push:
    branches:
      - feature/v0.3.1-runtime-binding

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.3.1-runtime-binding
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply production implementation and contract repair
        run: python scripts/v031_task5_repair.py
      - name: Verify focused causal and compatibility suite
        run: |
          python -m pip install -e . pytest pyflakes
          python -m py_compile wikiskill/harness.py wikiskill/prompts.py
          python -m pytest tests/test_v031_runtime_integration.py tests/test_v031_core_sealing.py tests/test_runtime_bindings.py tests/test_v03_contract.py tests/test_v03_core_runtime_binding.py tests/test_harness.py tests/test_v02_safety.py -q
          python -m pyflakes wikiskill/harness.py wikiskill/prompts.py tests/test_v031_runtime_integration.py tests/test_v03_contract.py
      - name: Commit verified Task 5 implementation
        run: |
          rm -f scripts/v031_task5_green.py scripts/v031_task5_repair.py .github/workflows/v031-task5-green.yml .github/workflows/v031-task5-repair.yml
          git config user.email wikiskill@local
          git config user.name wikiskill-evolution
          git add -A
          git commit -m "feat: score core candidates through bound runtimes"
          git push origin HEAD:feature/v0.3.1-runtime-binding
