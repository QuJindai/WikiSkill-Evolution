name: Diagnose V0.3 Task 4
on:
  push:
    branches: [feature/v0.3-git-source-adapter]
    paths: ['.github/workflows/diag-v03-task4.yml']
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.3-git-source-adapter
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run focused Task 4 tests
        run: |
          pip install -e . pytest pyflakes >/dev/null
          set +e
          python -m pytest tests/test_v03_contract.py -q -vv > /tmp/task4.txt 2>&1
          code=$?
          set -e
          {
            echo '# V0.3 Task 4 diagnostic'
            echo
            echo "pytest_exit_code=$code"
            echo
            echo '```text'
            cat /tmp/task4.txt
            echo '```'
          } > docs/superpowers/plans/2026-09-01-v0.3-task4-diagnostic.md
      - name: Commit diagnostic and cleanup
        run: |
          git config user.email wikiskill@local
          git config user.name wikiskill-evolution
          git add docs/superpowers/plans/2026-09-01-v0.3-task4-diagnostic.md
          git rm .github/workflows/diag-v03-task4.yml
          git commit -m 'test: capture V0.3 Task 4 failure evidence'
          git push origin HEAD:feature/v0.3-git-source-adapter
