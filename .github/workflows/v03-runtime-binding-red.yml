name: Verify V0.3 runtime binding RED

on:
  push:
    branches: [feature/v0.3-git-source-adapter]

permissions:
  contents: write

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.3-git-source-adapter
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -e . pytest pyflakes
      - name: Prove the new regression test is RED
        shell: bash
        run: |
          set +e
          python -m pytest tests/test_v03_core_runtime_binding.py -q > /tmp/runtime-red.txt 2>&1
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            cat /tmp/runtime-red.txt
            echo "Expected the runtime-binding regression test to fail before production fix."
            exit 1
          fi
          mkdir -p docs/superpowers/plans
          {
            echo '# V0.3 Core Runtime Binding RED'
            echo
            echo "pytest_exit_code=$code"
            echo
            echo '```text'
            cat /tmp/runtime-red.txt
            echo '```'
          } > docs/superpowers/plans/2026-09-02-v0.3-core-runtime-binding-red.md
      - name: Commit RED evidence and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/v03-runtime-binding-red.yml
          git config user.email 'wikiskill@local'
          git config user.name 'wikiskill-evolution'
          git add tests/test_v03_core_runtime_binding.py docs/superpowers/plans/2026-09-02-v0.3-core-runtime-binding-red.md .github/workflows/v03-runtime-binding-red.yml
          git diff --cached --quiet && exit 0
          git commit -m 'test: record unbound core runtime RED'
          git push origin HEAD:feature/v0.3-git-source-adapter
