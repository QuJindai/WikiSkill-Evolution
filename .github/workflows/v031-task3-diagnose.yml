name: Diagnose V0.3.1 Task 3 GREEN

on:
  push:
    branches: [feature/v0.3.1-runtime-binding]

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.3.1-runtime-binding
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run focused diagnostics
        shell: bash
        run: |
          python -m pip install -e . pytest pyflakes
          set +e
          python -m pytest tests/test_runtime_bindings.py -vv > /tmp/pytest.txt 2>&1
          pytest_code=$?
          python -m pyflakes wikiskill/runtime_bindings.py tests/test_runtime_bindings.py > /tmp/pyflakes.txt 2>&1
          pyflakes_code=$?
          set -e
          echo "$pytest_code" > /tmp/pytest.code
          echo "$pyflakes_code" > /tmp/pyflakes.code
          cat /tmp/pytest.txt
          cat /tmp/pyflakes.txt
      - name: Record diagnostic and remove workflow
        shell: bash
        run: |
          mkdir -p docs/superpowers/plans
          {
            echo '# V0.3.1 Task 3 GREEN Diagnostic'
            echo
            echo "pytest_exit_code=$(cat /tmp/pytest.code)"
            echo "pyflakes_exit_code=$(cat /tmp/pyflakes.code)"
            echo
            echo '## Pytest'
            echo '```text'
            cat /tmp/pytest.txt
            echo '```'
            echo
            echo '## Pyflakes'
            echo '```text'
            cat /tmp/pyflakes.txt
            echo '```'
          } > docs/superpowers/plans/2026-09-02-v0.3.1-task3-diagnostic.md
          rm -f .github/workflows/v031-task3-diagnose.yml
          git config user.email 'wikiskill@local'
          git config user.name 'wikiskill-evolution'
          git add docs/superpowers/plans/2026-09-02-v0.3.1-task3-diagnostic.md .github/workflows/v031-task3-diagnose.yml
          git commit -m 'test: record V0.3.1 Task 3 diagnostic'
          git push origin HEAD:feature/v0.3.1-runtime-binding
