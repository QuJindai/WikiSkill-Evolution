name: Diagnose V0.3 Task 4 post-repair
on:
  push:
    branches: [feature/v0.3-git-source-adapter]
    paths: ['.github/workflows/diag-v03-task4-postrepair.yml']
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.3-git-source-adapter
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          pip install -e . pytest pyflakes >/dev/null
          set +e
          python -m pytest tests/test_v03_contract.py -q -vv > /tmp/out.txt 2>&1
          code=$?
          set -e
          { echo '# V0.3 Task 4 post-repair diagnostic'; echo; echo "pytest_exit_code=$code"; echo; echo '```text'; cat /tmp/out.txt; echo '```'; } > docs/superpowers/plans/2026-09-01-v0.3-task4-postrepair-diagnostic.md
      - run: |
          git config user.email wikiskill@local
          git config user.name wikiskill-evolution
          git add docs/superpowers/plans/2026-09-01-v0.3-task4-postrepair-diagnostic.md
          git rm .github/workflows/diag-v03-task4-postrepair.yml
          git commit -m 'test: capture post-repair Task 4 evidence'
          git push origin HEAD:feature/v0.3-git-source-adapter
