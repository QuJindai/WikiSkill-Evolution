name: Verify V0.3.1 Task 3 RED

on:
  push:
    branches: [feature/v0.3.1-runtime-binding]

permissions:
  contents: write

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.3.1-runtime-binding
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Confirm missing bound-runtime API RED
        shell: bash
        run: |
          python -m pip install -e . pytest pyflakes
          set +e
          python -m pytest tests/test_runtime_bindings.py -q > /tmp/red.txt 2>&1
          code=$?
          set -e
          cat /tmp/red.txt
          test "$code" -ne 0
          grep -Eq "bind_active_accepted|bind_sha|BoundRuntimeSession" /tmp/red.txt
      - name: Record RED evidence and remove workflow
        shell: bash
        run: |
          mkdir -p docs/superpowers/plans
          {
            echo '# V0.3.1 Task 3 RED'
            echo
            echo 'Expected failure: BoundRuntimeSession/bind_sha/bind_active_accepted are absent.'
            echo
            echo '```text'
            cat /tmp/red.txt
            echo '```'
          } > docs/superpowers/plans/2026-09-02-v0.3.1-task3-red.md
          rm -f .github/workflows/v031-task3-red.yml
          git config user.email 'wikiskill@local'
          git config user.name 'wikiskill-evolution'
          git add tests/test_runtime_bindings.py docs/superpowers/plans/2026-09-02-v0.3.1-task3-red.md .github/workflows/v031-task3-red.yml
          git commit -m 'test: record V0.3.1 Task 3 RED'
          git push origin HEAD:feature/v0.3.1-runtime-binding
