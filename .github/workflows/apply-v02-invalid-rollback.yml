name: Apply V0.2 invalid rollback fix

on:
  push:
    branches: [feature/v0.2-asset-drivers]
    paths: ['.github/workflows/apply-v02-invalid-rollback.yml']

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.2-asset-drivers
          fetch-depth: 0
      - name: Apply minimal safety fix
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('wikiskill/assets.py')
          text = p.read_text()
          old = (
              '        if action == "create":\n'
              '            if not isinstance(proposal.get("skill_md"), str):\n'
              '                raise ValueError("skill create requires skill_md text")\n'
          )
          new = (
              '        if action == "create":\n'
              '            if not isinstance(proposal.get("skill_md"), str):\n'
              '                raise ValueError("skill create requires skill_md text")\n'
              '            purpose = proposal.get("purpose_md")\n'
              '            if purpose is not None and not isinstance(purpose, str):\n'
              '                raise ValueError("purpose_md must be text")\n'
          )
          if old not in text:
              raise SystemExit('SkillDriver validate block not found')
          p.write_text(text.replace(old, new, 1))

          p = Path('wikiskill/harness.py')
          text = p.read_text()
          old = (
              '        try:\n'
              '            driver = assets.resolve_driver(target)\n'
              '            driver.validate(ws, proposal)\n'
              '            driver.prepare(ws, k)\n'
              '            desc = driver.apply(ws, proposal)\n'
              '            diff = driver.diff(ws)\n'
              '        except ValueError as exc:\n'
              '            err = str(exc)\n'
          )
          new = (
              '        driver = None\n'
              '        prepared = False\n'
              '        try:\n'
              '            driver = assets.resolve_driver(target)\n'
              '            driver.validate(ws, proposal)\n'
              '            driver.prepare(ws, k)\n'
              '            prepared = True\n'
              '            desc = driver.apply(ws, proposal)\n'
              '            diff = driver.diff(ws)\n'
              '        except ValueError as exc:\n'
              '            if prepared and driver is not None:\n'
              '                driver.rollback(ws)\n'
              '            err = str(exc)\n'
          )
          if old not in text:
              raise SystemExit('candidate lifecycle block not found')
          p.write_text(text.replace(old, new, 1))
          PY
      - name: Commit safety fix
        run: |
          git config user.email wikiskill@local
          git config user.name wikiskill-evolution
          git add wikiskill/assets.py wikiskill/harness.py
          git rm .github/workflows/apply-v02-invalid-rollback.yml
          git commit -m 'fix: rollback partially applied invalid candidates'
          git push origin HEAD:feature/v0.2-asset-drivers
