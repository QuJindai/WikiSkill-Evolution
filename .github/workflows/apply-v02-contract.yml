name: Apply V0.2 contract patch

on:
  push:
    branches: [feature/v0.2-asset-drivers]
    paths: ['.github/workflows/apply-v02-contract.yml']

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.2-asset-drivers
          fetch-depth: 0
      - name: Apply proposer and CLI contract
        env:
          PROPOSER_GZ_B64: 
          SKILL_GZ_B64: 
        run: |
          python - <<'PY'
          import base64, gzip, os
          from pathlib import Path
          p = Path('wikiskill/prompts.py')
          text = p.read_text()
          proposer = gzip.decompress(base64.b64decode(os.environ['PROPOSER_GZ_B64'])).decode()
          start = text.index('def proposer_prompt(')
          end = text.index('def gate_outcome_entry(')
          p.write_text(text[:start] + proposer + '\n\n' + text[end:])
          Path('skills/wikiskill-proposer/SKILL.md').write_bytes(
              gzip.decompress(base64.b64decode(os.environ['SKILL_GZ_B64'])))
          cli = Path('wikiskill/cli.py')
          c = cli.read_text()
          old = 'sp.add_argument("--max-turns", type=int, default=15,\n                    help="per-task inference turn budget (tighter = harder)")'
          new = 'sp.add_argument("--max-turns", type=int, default=None,\n                    help="explicit per-task inference turn override; default uses active harness policy or 15")'
          if old not in c:
              raise SystemExit('CLI evolve max-turns block not found')
          cli.write_text(c.replace(old, new, 1))
          PY
      - name: Commit decoded patch
        run: |
          git config user.email wikiskill@local
          git config user.name wikiskill-evolution
          git add wikiskill/prompts.py wikiskill/cli.py skills/wikiskill-proposer/SKILL.md
          git rm .github/workflows/apply-v02-contract.yml
          git commit -m 'feat: expose multi-asset proposer contract'
          git push origin HEAD:feature/v0.2-asset-drivers
