name: Verify V0.3.1 Task 4 GREEN

on:
  push:
    branches: [feature/v0.3.1-runtime-binding]

permissions:
  contents: write

jobs:
  green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.3.1-runtime-binding
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply Task 4 implementation
        run: python scripts/v031_task4_green.py
      - name: Verify focused contracts and compatibility
        shell: bash
        run: |
          python -m pip install -e . pytest pyflakes
          python -m py_compile wikiskill/gating.py wikiskill/cli.py wikiskill/prompts.py
          python -m pytest tests/test_v031_runtime_cli.py tests/test_v03_source_cli.py tests/test_v02_contract.py tests/test_core.py -q | tee /tmp/green.txt
          python -m pyflakes wikiskill/gating.py wikiskill/cli.py wikiskill/prompts.py tests/test_v031_runtime_cli.py
      - name: Commit GREEN and cleanup
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('docs/superpowers/plans/2026-09-02-v0.3.1-execution-log.md')
          text = path.read_text()
          addition = '- Task 4 RED `ee470a885677bb614748bee305e3d8f1c0d3cf2a`: atomic state/runtime trace/runtime CLI/run-task/proposer tests added before production support. Initial RED had one test-only NameError; corrected fixture rerun at `d6abf8fb1d29d24f57cb0b0eed9c054b36f1dc3a` preserved six expected product failures with no fixture error.\n'
          if 'Task 4 RED' not in text:
              path.write_text(text + addition)
          PY
          mkdir -p docs/superpowers/plans
          {
            echo '# V0.3.1 Task 4 GREEN'
            echo
            echo '```text'
            cat /tmp/green.txt
            echo '```'
          } > docs/superpowers/plans/2026-09-02-v0.3.1-task4-green.md
          rm -f scripts/v031_task4_green.py .github/workflows/v031-task4-green.yml
          git config user.email 'wikiskill@local'
          git config user.name 'wikiskill-evolution'
          git add wikiskill/gating.py wikiskill/cli.py wikiskill/prompts.py tests/test_v031_runtime_cli.py docs/superpowers/plans/2026-09-02-v0.3.1-execution-log.md docs/superpowers/plans/2026-09-02-v0.3.1-task4-green.md scripts/v031_task4_green.py .github/workflows/v031-task4-green.yml
          git commit -m 'feat: expose trusted active runtime operations'
          git push origin HEAD:feature/v0.3.1-runtime-binding
