name: Apply V0.3 Task 3 fix
on:
  push:
    branches: [feature/v0.3-git-source-adapter]
    paths: ['.github/workflows/apply-v03-task3-fix.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.3-git-source-adapter
          fetch-depth: 0
      - name: Align reject cleanup API
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('wikiskill/core_adapter.py')
          s = p.read_text()
          old = '''def reject_candidate(session: CandidateSession) -> dict:\n    cleanup = _cleanup_worktree(session)\n    return {\n        "source_id": session.source_id,\n        "base_sha": session.base_sha,\n        "candidate_sha": session.candidate_sha,\n        "cleanup": cleanup,\n        "accepted_sha": sources.accepted_sha(session.ws, session.source_id),\n    }\n'''
          new = '''def reject_candidate(session: CandidateSession) -> dict:\n    return _cleanup_worktree(session)\n'''
          if old not in s:
              raise SystemExit('expected reject_candidate block not found')
          p.write_text(s.replace(old, new, 1))
          PY
          git config user.email wikiskill@local
          git config user.name wikiskill-evolution
          git add wikiskill/core_adapter.py
          git rm .github/workflows/apply-v03-task3-fix.yml
          git commit -m 'fix: return core rejection cleanup result directly'
          git push origin HEAD:feature/v0.3-git-source-adapter
