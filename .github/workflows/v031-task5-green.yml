name: Verify V0.3.1 Task 5 GREEN

on:
  push:
    branches: [feature/v0.3.1-runtime-binding]

permissions:
  contents: write

jobs:
  green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.3.1-runtime-binding
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply Task 5 implementation
        run: python scripts/v031_task5_green.py
      - name: Verify causal runtime and compatibility suites
        shell: bash
        run: |
          python -m pip install -e . pytest pyflakes
          python -m py_compile wikiskill/harness.py wikiskill/prompts.py
          set -o pipefail
          python -m pytest \
            tests/test_v031_runtime_integration.py \
            tests/test_v031_core_sealing.py \
            tests/test_runtime_bindings.py \
            tests/test_v03_contract.py \
            tests/test_v03_core_runtime_binding.py \
            tests/test_harness.py \
            tests/test_v02_safety.py -q | tee /tmp/green.txt
          python -m pyflakes wikiskill/harness.py wikiskill/prompts.py tests/test_v031_runtime_integration.py
      - name: Commit GREEN and cleanup staging files
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('docs/superpowers/plans/2026-09-02-v0.3.1-execution-log.md')
          text = path.read_text()
          addition = '- Task 5 RED `a442cfe51cfdb7e43962e2e6768a75b9d6c132e7`: real-Git/runtime integration suite added. Corrected RED evidence head `785bec03138ed8a19afc787892c7365d0628d45a`: 7 expected lifecycle failures, legacy no-active-runtime path PASS, no fixture errors.\n'
          if 'Task 5 RED' not in text:
              path.write_text(text + addition)
          PY
          mkdir -p docs/superpowers/plans
          {
            echo '# V0.3.1 Task 5 GREEN'
            echo
            echo '```text'
            cat /tmp/green.txt
            echo '```'
          } > docs/superpowers/plans/2026-09-02-v0.3.1-task5-green.md
          rm -f scripts/v031_task5_green.py .github/workflows/v031-task5-green.yml
          git config user.email 'wikiskill@local'
          git config user.name 'wikiskill-evolution'
          git add wikiskill/harness.py wikiskill/prompts.py tests/test_v031_runtime_integration.py docs/superpowers/plans/2026-09-02-v0.3.1-execution-log.md docs/superpowers/plans/2026-09-02-v0.3.1-task5-green.md scripts/v031_task5_green.py .github/workflows/v031-task5-green.yml
          git commit -m 'feat: score core candidates through bound runtimes'
          git push origin HEAD:feature/v0.3.1-runtime-binding
