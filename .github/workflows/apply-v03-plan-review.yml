name: Apply V0.3 plan review fixes
on:
  push:
    branches: [feature/v0.3-git-source-adapter]
    paths: ['.github/workflows/apply-v03-plan-review.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.3-git-source-adapter
          fetch-depth: 0
      - name: Align implementation-plan interfaces
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/superpowers/plans/2026-09-01-v0.3-git-source-adapter-implementation.md')
          s = p.read_text()
          s = s.replace(
              '- Produces: `validate_registered_source(ws: str, source_id: str, *, gate_registry=None) -> dict`\n',
              '- Produces: `validate_registered_source(ws: str, source_id: str, *, gate_registry=None) -> dict`\n- Produces: `proposer_source_summary(ws: str) -> str`\n- Produces: `SourceOperationalError(RuntimeError)`\n')
          s = s.replace(
              'On first registration create `refs/wikiskill/<source_id>/accepted` with `git update-ref <ref> <baseline_sha> <40-zero-old-or-empty-create-semantics>`. If the ref already exists, never reset it from the manifest.',
              'On first registration create `refs/wikiskill/<source_id>/accepted` with `git update-ref <ref> <baseline_sha> ""`; the empty old-OID argument is the create-only check and fails if the ref already exists. If the ref already exists, never reset it from the manifest.')
          s = s.replace(
              'Then atomically writes runtime JSON through a temp file plus `os.replace`. If state write fails, attempt a compensating CAS from `<new_sha>` back to `<expected_old>` before raising an operational error.',
              'Then atomically writes runtime JSON through a temp file plus `os.replace`. If state write fails, attempt a compensating CAS from `<new_sha>` back to `<expected_old>` before raising `SourceOperationalError`. `core_adapter` converts source/gate operational exceptions into `CoreOperationalError` so the harness never learns infrastructure failure as candidate quality.')
          s = s.replace(
              '- A gate process launch error raises `CoreOperationalError`.\n',
              '- A gate process launch error raises `CoreOperationalError`.\n- `gates.GateOperationalError` and `sources.SourceOperationalError` are wrapped as `CoreOperationalError` at the adapter boundary.\n')
          p.write_text(s)
          PY
          git config user.email wikiskill@local
          git config user.name wikiskill-evolution
          git add docs/superpowers/plans/2026-09-01-v0.3-git-source-adapter-implementation.md
          git rm .github/workflows/apply-v03-plan-review.yml
          git commit -m 'docs: self-review V0.3 implementation plan'
          git push origin HEAD:feature/v0.3-git-source-adapter
