name: Apply V0.3 Task 4 compatibility fixes
on:
  push:
    branches: [feature/v0.3-git-source-adapter]
    paths: ['.github/workflows/apply-v03-task4-compat-fix.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.3-git-source-adapter
          fetch-depth: 0
      - name: Restore legacy driver-call compatibility
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('wikiskill/harness.py')
          s = p.read_text()
          marker = '\ndef evolve(\n'
          helpers = '\n'.join([
              '',
              'def _driver_prepare(driver, target: str, ws: str, iteration: int, proposal: dict):',
              '    if target == "core":',
              '        return driver.prepare(ws, iteration, proposal)',
              '    driver.prepare(ws, iteration)',
              '    return None',
              '',
              '',
              'def _driver_apply(driver, target: str, ws: str, proposal: dict, context):',
              '    if target == "core":',
              '        return driver.apply(ws, proposal, context)',
              '    return driver.apply(ws, proposal)',
              '',
              '',
              'def _driver_diff(driver, target: str, ws: str, context):',
              '    if target == "core":',
              '        return driver.diff(ws, context)',
              '    return driver.diff(ws)',
              '',
              '',
              'def _driver_pre_gates(driver, target: str, ws: str, proposal: dict, context):',
              '    if target == "core":',
              '        return driver.pre_gates(ws, proposal, context)',
              '    return []',
              '',
              '',
              'def _driver_accept(driver, target: str, ws: str, iteration: int, score: float, context):',
              '    if target == "core":',
              '        return driver.accept(ws, iteration, score, context)',
              '    return driver.accept(ws, iteration, score)',
              '',
              '',
              'def _driver_rollback(driver, target: str, ws: str, context):',
              '    if target == "core":',
              '        return driver.rollback(ws, context)',
              '    return driver.rollback(ws)',
              '',
          ])
          if 'def _driver_prepare(' not in s:
              s = s.replace(marker, helpers + marker, 1)
          replacements = {
              'context = driver.prepare(ws, k, proposal)': 'context = _driver_prepare(driver, target, ws, k, proposal)',
              'desc = driver.apply(ws, proposal, context)': 'desc = _driver_apply(driver, target, ws, proposal, context)',
              'diff = driver.diff(ws, context)': 'diff = _driver_diff(driver, target, ws, context)',
              'pre_gates = driver.pre_gates(ws, proposal, context)': 'pre_gates = _driver_pre_gates(driver, target, ws, proposal, context)',
              'cleanup = driver.rollback(ws, context)': 'cleanup = _driver_rollback(driver, target, ws, context)',
              'finalize = driver.accept(ws, k, r_val, context)': 'finalize = _driver_accept(driver, target, ws, k, r_val, context)',
              'wiki.commit(ws, f"iter-{k:02d}: {status} target={target}")': 'wiki.commit(ws, f"iter-{k:02d}: gate outcome {status} target={target}")',
          }
          for old, new in replacements.items():
              s = s.replace(old, new)
          p.write_text(s)

          p = Path('tests/test_assets.py')
          s = p.read_text()
          start = s.index('def test_core_target_is_known_but_mutation_is_unsupported')
          replacement = '\n'.join([
              'def test_core_target_is_known_and_unregistered_source_fails_closed(tmp_path):',
              '    d = assets.resolve_driver("core")',
              '    assert d.target == "core"',
              '    proposal = {',
              '        "target": "core",',
              '        "action": "patch",',
              '        "source_id": "missing-core",',
              '        "base_sha": "0" * 40,',
              '        "edits": [{"file": "src/value.txt", "op": "append", "content": "x"}],',
              '    }',
              '    with pytest.raises(ValueError, match="unknown source_id"):',
              '        d.validate(str(tmp_path), proposal)',
              '',
          ])
          s = s[:start] + replacement
          p.write_text(s)
          PY
          python -m py_compile wikiskill/harness.py
      - name: Commit fixes and cleanup diagnostics
        run: |
          git config user.email wikiskill@local
          git config user.name wikiskill-evolution
          git add wikiskill/harness.py tests/test_assets.py
          if [ -f .github/workflows/diag-v03-task4-compat.yml ]; then git rm .github/workflows/diag-v03-task4-compat.yml; fi
          git rm .github/workflows/apply-v03-task4-compat-fix.yml
          git commit -m 'fix: preserve V0.2 lifecycle compatibility'
          git push origin HEAD:feature/v0.3-git-source-adapter
