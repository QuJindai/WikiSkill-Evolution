name: Update V0.3 README
on:
  push:
    branches: [feature/v0.3-git-source-adapter]
    paths: ['.github/workflows/update-v03-readme.yml']
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.3-git-source-adapter
          fetch-depth: 0
      - name: Add V0.3 overview and Source CLI rows
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          p = Path('README.md')
          s = p.read_text(encoding='utf-8')
          insert = base64.b64decode('').decode()
          marker = 'See [V0.2 Asset Drivers](docs/V0.2-ASSET-DRIVERS.md) for schemas, workspace\npaths, policy precedence, and safety boundaries.\n\n## Why Hermes?'
          if marker not in s:
              raise SystemExit('README V0.2 marker not found')
          s = s.replace(marker, 'See [V0.2 Asset Drivers](docs/V0.2-ASSET-DRIVERS.md) for schemas, workspace\npaths, policy precedence, and safety boundaries.\n\n' + insert + '## Why Hermes?', 1)
          row = '| `wikiskill run-task <id>` | Single inference rollout (debug) |\n'
          extra = (
              '| `wikiskill source register <manifest> [--ws PATH]` | Register a trusted local Git source manifest |\n'
              '| `wikiskill source list [--ws PATH]` | List registered sources and accepted SHAs |\n'
              '| `wikiskill source inspect <source_id> [--ws PATH]` | Inspect trusted manifest + accepted-state mirror |\n'
              '| `wikiskill source validate <source_id> [--ws PATH]` | Revalidate repository/ref/policy/Gate registration |\n'
          )
          if row not in s:
              raise SystemExit('README CLI marker not found')
          s = s.replace(row, row + extra, 1)
          p.write_text(s, encoding='utf-8')
          PY
          git config user.email wikiskill@local
          git config user.name wikiskill-evolution
          git add README.md
          git rm .github/workflows/update-v03-readme.yml
          git commit -m 'docs: document V0.3 source evolution in README'
          git push origin HEAD:feature/v0.3-git-source-adapter
