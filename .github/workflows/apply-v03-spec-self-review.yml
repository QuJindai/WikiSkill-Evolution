name: Apply V0.3 spec self-review

on:
  push:
    branches: [feature/v0.3-git-source-adapter]
    paths: ['.github/workflows/apply-v03-spec-self-review.yml']

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.3-git-source-adapter
          fetch-depth: 0
      - name: Remove one-shot workflow after completed spec review
        run: |
          git config user.email wikiskill@local
          git config user.name wikiskill-evolution
          git rm .github/workflows/apply-v03-spec-self-review.yml
          git commit -m 'chore: remove V0.3 spec self-review workflow'
          git push origin HEAD:feature/v0.3-git-source-adapter
