name: Apply V0.3 spec self-review

on:
  push:
    branches: [feature/v0.3-git-source-adapter]
    paths: ['.github/workflows/apply-v03-spec-self-review.yml']

permissions:
  contents: write

jobs:
  update-spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.3-git-source-adapter
          fetch-depth: 0
      - name: Apply design clarifications
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/superpowers/specs/2026-09-01-v0.3-git-source-adapter-design.md')
          text = p.read_text(encoding='utf-8')

          replacements = []
          replacements.append((
              'Unknown manifest keys fail closed unless explicitly marked as metadata by the schema. Manifest validation occurs before a source can be registered or used.',
              'Unknown manifest keys fail closed. V0.3 has no free-form metadata escape hatch in the manifest schema. Manifest validation occurs before a source can be registered or used.'
          ))
          replacements.append((
              'The registered gate profile is trusted configuration controlled outside the proposal path.\n\n### 5.2 Gate result contract',
              'The registered gate profile is trusted configuration controlled outside the proposal path.\n\nIn V0.3, production gate profiles are a static trusted registry implemented in `wikiskill/gates.py`. There is no runtime or CLI API for an agent to add, replace, or redefine a registered gate profile. Tests may inject test-only profiles through an explicit dependency seam, but production proposal data never becomes executable configuration.\n\n### 5.2 Gate result contract'
          ))
          replacements.append((
              'Each core candidate runs in a fresh isolated Git worktree rooted at the exact registered `baseline_sha`.\n\nConceptually:',
              'Each core candidate runs in a fresh isolated Git worktree rooted at the exact current accepted SHA. The worktree path is generated by the adapter under `workspaces/<domain>/runs/core-worktrees/iter-<NN>-<source_id>-<short-sha>/`; proposal data cannot choose or escape this root.\n\nConceptually:'
          ))
          replacements.append((
              'On full acceptance:\n\n1. candidate source worktree has a deterministic diff;\n2. mandatory pre-gates pass;\n3. performance is `pass` or explicitly `not_configured`;\n4. held-out `R_candidate > R_best`;\n5. candidate commit is created/read back;\n6. source state advances from `base_sha` to accepted candidate SHA;\n7. WikiSkill `R_best` advances;\n8. source/Wiki audit records are committed;\n9. temporary worktree is removed safely.\n\nThe manifest file itself is trusted configuration and is not silently rewritten by the Evolution Proposer. Runtime accepted-source state may be stored separately from the operator-authored manifest so provenance remains explicit.',
              'On full acceptance:\n\n1. candidate source worktree has a deterministic diff;\n2. mandatory pre-gates pass;\n3. performance is `pass` or explicitly `not_configured`;\n4. held-out `R_candidate > R_best`;\n5. candidate commit is created/read back;\n6. the adapter atomically advances `refs/wikiskill/<source_id>/accepted` from the expected old accepted SHA to the candidate SHA using compare-and-swap semantics;\n7. runtime accepted-source JSON mirrors that exact ref SHA;\n8. WikiSkill `R_best` advances;\n9. source/Wiki audit records are committed;\n10. temporary worktree is removed safely.\n\nThe namespaced Git ref is the authoritative accepted-source baseline after registration. Keeping the commit reachable by this ref prevents a detached accepted commit from becoming garbage-collectable after worktree removal. The manifest remains the operator-authored initial anchor and policy document; runtime JSON is an audit/readability mirror, not the source of truth.'
          ))
          replacements.append((
              'Resolution rule:\n\n1. on first use, accepted SHA is initialized from manifest `baseline_sha`;\n2. later proposals must bind to runtime `accepted_sha`;\n3. acceptance advances runtime state only after all gates and readback succeed;\n4. rejection never changes runtime accepted SHA.',
              'Resolution rule:\n\n1. first registration verifies manifest `baseline_sha` and creates `refs/wikiskill/<source_id>/accepted` at that SHA when the ref does not yet exist;\n2. the namespaced accepted ref is authoritative on every later run;\n3. runtime JSON must mirror the ref and is repaired from the ref if they disagree;\n4. every later proposal must bind `base_sha` to the current accepted ref SHA;\n5. acceptance advances the ref atomically only from the expected old SHA, then updates runtime JSON;\n6. rejection never changes the accepted ref or runtime accepted SHA;\n7. re-registering an existing `source_id` may update trusted policy only when repository identity and original baseline anchor remain compatible; V0.3 has no implicit baseline-reset operation.'
          ))
          replacements.append((
              '6. runtime accepted-state initializes from manifest baseline;\n7. later proposal must bind to current accepted SHA.',
              '6. registration creates the namespaced accepted Git ref from manifest baseline;\n7. runtime accepted-state mirrors the namespaced ref;\n8. accepted ref/runtime-state mismatch repairs from the ref;\n9. later proposal must bind to current accepted ref SHA.'
          ))
          replacements.append((
              '18. isolated worktree created at exact base SHA;\n19. registered source working tree is not modified;\n20. deterministic text patch applies;\n21. actual diff is auditable;\n22. Static FAIL prevents Build;\n23. Build FAIL prevents Regression;\n24. Regression FAIL prevents Performance and held-out Gate;\n25. configured Performance FAIL prevents held-out Gate;\n26. `not_configured` performance is allowed only when manifest has no profile;\n27. held-out non-improvement rolls back candidate;\n28. all engineering gates pass + held-out improvement accepts candidate;\n29. acceptance advances accepted-source SHA exactly once;\n30. rejection leaves accepted-source SHA unchanged;\n31. candidate worktree is removed after finalization;\n32. cleanup failure never causes acceptance.',
              '20. isolated worktree created at exact accepted ref SHA under the fixed workspace worktree root;\n21. registered source working tree is not modified;\n22. deterministic text patch applies;\n23. actual diff is auditable;\n24. Static FAIL prevents Build;\n25. Build FAIL prevents Regression;\n26. Regression FAIL prevents Performance and held-out Gate;\n27. configured Performance FAIL prevents held-out Gate;\n28. `not_configured` performance is allowed only when manifest has no profile;\n29. held-out non-improvement rolls back candidate;\n30. all engineering gates pass + held-out improvement accepts candidate;\n31. acceptance advances `refs/wikiskill/<source_id>/accepted` exactly once by compare-and-swap;\n32. accepted commit remains reachable after worktree removal;\n33. rejection leaves accepted ref/source state unchanged;\n34. candidate worktree is removed after finalization;\n35. cleanup failure never causes acceptance.'
          ))

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'expected spec text not found: {old[:80]}')
              text = text.replace(old, new, 1)

          p.write_text(text, encoding='utf-8')
          PY
      - name: Commit spec clarification and remove one-shot workflow
        run: |
          git config user.email wikiskill@local
          git config user.name wikiskill-evolution
          git add docs/superpowers/specs/2026-09-01-v0.3-git-source-adapter-design.md
          git rm .github/workflows/apply-v03-spec-self-review.yml
          git commit -m 'docs: resolve V0.3 source-of-truth and isolation semantics'
          git push origin HEAD:feature/v0.3-git-source-adapter
