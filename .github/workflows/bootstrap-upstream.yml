name: Finalize pinned WikiSkill mirror

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/bootstrap-upstream.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4

      - name: Restore missing pinned binary and provenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets
          curl -fsSL 'https://raw.githubusercontent.com/ashutoshsinghpr7/wikiskill/d4072d2e5e2949b0c1346c4158f7e49785d787de/assets/og-banner.png' -o assets/og-banner.png
          test "$(git hash-object assets/og-banner.png)" = 'e24068f79f70304da1decb5d46809c0fca119bd3'
          cat > UPSTREAM.md <<'EOF'
          # Upstream provenance

          This public repository is an independent evolution workspace based on the MIT-licensed WikiSkill community implementation.

          - Upstream: https://github.com/ashutoshsinghpr7/wikiskill
          - Locked upstream commit: `d4072d2e5e2949b0c1346c4158f7e49785d787de`
          - Paper: arXiv:2608.27454
          - License: MIT; the original `LICENSE` is preserved unchanged.
          - Import basis: source files are pinned to the upstream commit above; `UPSTREAM.md` is the local provenance record.

          This repository is not the official Google Research repository.
          EOF
          rm -f BOOTSTRAP_UPSTREAM
          rm -f .github/workflows/bootstrap-upstream.yml

      - name: Verify source tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install -e . pytest pyflakes
          python3 -m pyflakes wikiskill/ tests/
          python3 -m pytest tests/ -q

      - name: Commit final mirror state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'bootstrap: finalize WikiSkill upstream d4072d2e'
          git push origin HEAD:main
