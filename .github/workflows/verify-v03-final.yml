name: Verify V0.3 final security
on:
  push:
    branches: [feature/v0.3-git-source-adapter]
    paths: ['.github/workflows/verify-v03-final.yml']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.3-git-source-adapter
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e . pytest pyflakes
      - name: Run focused security, lint, and full tests
        shell: bash
        run: |
          set +e
          python3 -m pytest tests/test_sources.py tests/test_core_adapter.py tests/test_v03_contract.py -q > /tmp/security.txt 2>&1
          security_rc=$?
          python3 -m pyflakes wikiskill/ tests/ > /tmp/lint.txt 2>&1
          lint_rc=$?
          python3 -m pytest tests/ -q > /tmp/full.txt 2>&1
          full_rc=$?
          {
            echo '# V0.3 Final Verification Evidence'
            echo
            echo "verified_head=$(git rev-parse HEAD)"
            echo "security_exit_code=$security_rc"
            echo "pyflakes_exit_code=$lint_rc"
            echo "full_pytest_exit_code=$full_rc"
            echo
            echo '## Focused security suite'
            echo '```text'
            cat /tmp/security.txt
            echo '```'
            echo
            echo '## Pyflakes'
            echo '```text'
            cat /tmp/lint.txt
            echo '```'
            echo
            echo '## Full pytest'
            echo '```text'
            cat /tmp/full.txt
            echo '```'
          } > docs/superpowers/plans/2026-09-02-v0.3-final-verification.md
          git config user.email wikiskill@local
          git config user.name wikiskill-evolution
          git add docs/superpowers/plans/2026-09-02-v0.3-final-verification.md
          git rm .github/workflows/verify-v03-final.yml
          git commit -m 'test: record final V0.3 verification evidence'
          git push origin HEAD:feature/v0.3-git-source-adapter
          test "$security_rc" -eq 0
          test "$lint_rc" -eq 0
          test "$full_rc" -eq 0
